  <script>
    (function () {
      // 北京时间实时时钟：若不需要可移除 setInterval 与 tick 调用
      const timeEl = document.getElementById('time-beijing');
      const weekdayMap = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      function pad(n) { return n.toString().padStart(2, '0'); }
      function tick() {
        if (!timeEl) return;
        const now = new Date();
        const fmt = new Intl.DateTimeFormat('zh-CN', {
          timeZone: 'Asia/Shanghai',
          hour12: false,
          hour: '2-digit',
          minute: '2-digit',
          month: 'numeric',
          day: 'numeric',
          weekday: 'short'
        }).formatToParts(now)
          .reduce((acc, part) => ({ ...acc, [part.type]: part.value }), {});

        const hour = fmt.hour ?? '--';
        const minute = fmt.minute ?? '--';
        const month = fmt.month ?? '--';
        const day = fmt.day ?? '--';
        // 部分浏览器 weekday 会返回“周四”，否则 fallback
        const weekday = fmt.weekday ?? weekdayMap[new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Shanghai' })).getDay()];

        timeEl.textContent = `${month}月${day}日 ${hour}:${minute} ${weekday}`;
      }
      tick();
      setInterval(tick, 1000);

      // 语录池：按需增删语录
      const quotes = [
        { text: '愿所有的美好都能得到祝福!', author: '——「admin」' },
        { text: '"只有频率相同的人，才能看见彼此内心深处不为人知的优雅.', author: '—— 「admin」' },
        { text: '你的心态就是你人生最大本钱.', author: '—— 「admin」' },
        { text: '每天都是新的开始，不要被昨天困住.' , author: '—— 「admin」'},
        { text: '行到水穷处，坐看云起时.', author: '—— 「admin」' }
      ];

      const textEl = document.getElementById('quote-text');
      const authorEl = document.getElementById('quote-author');
      const switchBtn = document.getElementById('quote-switch');

      function nextQuote() {
        if (!textEl || !authorEl) return;
        const current = textEl.textContent?.trim();
        const pool = quotes.filter((q) => q.text !== current);
        const picked = pool[Math.floor(Math.random() * pool.length)];
        textEl.textContent = picked.text;
        authorEl.textContent = picked.author;
      }

      switchBtn?.addEventListener('click', nextQuote);
    })();
  </script>
